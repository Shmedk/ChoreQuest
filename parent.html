<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Parent Dashboard | ChoreQuest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="parent">
<header>
    <h1>🧹 Parent Dashboard</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="child.html">Child</a>
    </nav>
</header>

<main class="dashboard">
    <h2>Add a New Quest</h2>

    <form class="quest-form" onsubmit="return false;">
        <label>
            <input type="text" placeholder="Quest Title (e.g. Clean your room)" required>
        </label>
        <label>
            <textarea placeholder="Description (what to do)"></textarea>
        </label>
        <label>
            <input type="text" placeholder="Reward (e.g. 1 gold star)">
        </label>
        <button type="button">Add Quest</button>
        <button id="aiSuggest" type="button">AI Suggest Quests</button>
    </form>

    <h2>Active Quests</h2>
    <div class="quest-list"></div>
</main>
<script src="script.js"></script>
</body>
</html>
